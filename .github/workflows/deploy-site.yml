name: Publicar site Hero Rift

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hero-rift-pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
